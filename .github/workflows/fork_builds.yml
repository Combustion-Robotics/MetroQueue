name: Fork Builds

# Optimized (release) APKs for this fork, signed with the same debug key as local builds.
# main -> "Metrolist Dev" (com.metrolist.music.dev), published as a normal versioned release v<version>-cr<N>.
# dev  -> "Metrolist Beta" (com.metrolist.music.beta), published to the rolling "dev Builds" pre-release.
on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'MetrolistGroup/Metrolist'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            echo "$DEV_KEYSTORE_BASE64" | base64 -d > app/ci-debug.keystore
          else
            echo "::warning::DEV_KEYSTORE_BASE64 secret not set. Using a throwaway key, so this APK won't install over earlier builds."
            keytool -genkeypair -keystore app/ci-debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Metrolist CI,O=Metrolist,C=US"
          fi

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew --console=plain :app:assembleFossRelease --warning-mode summary
        env:
          METROLIST_DEBUG_KEYSTORE_PATH: ci-debug.keystore
          METROLIST_APPLICATION_ID: ${{ github.ref_name == 'main' && 'com.metrolist.music.dev' || 'com.metrolist.music.beta' }}
          METROLIST_APP_NAME: ${{ github.ref_name == 'main' && 'Metrolist Dev' || 'Metrolist Beta' }}
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Name the build
        id: name
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          if [ "${{ github.ref_name }}" = "main" ]; then
            # Continue the fork's v<version>-cr<N> numbering
            LAST=$(git ls-remote --tags origin "refs/tags/v$VERSION-cr*" | sed -n 's/.*-cr\([0-9]*\)$/\1/p' | sort -n | tail -1)
            TAG="v$VERSION-cr$(( ${LAST:-0} + 1 ))"
            APK="Metrolist-$TAG-foss.apk"
          else
            TAG="dev-builds"
            APK="Metrolist-Beta-v$VERSION-${GITHUB_SHA::7}-foss.apk"
          fi
          mkdir -p out
          mv app/build/outputs/apk/foss/release/*.apk "out/$APK"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-${{ github.ref_name }}
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          NOTES="Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          if [ "${{ github.ref_name }}" = "main" ]; then
            gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --latest --title "${TAG#v}" --notes "$NOTES"
          else
            # One rolling pre-release that always holds the newest dev build
            gh release delete "$TAG" --cleanup-tag --yes || true
            gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --prerelease --latest=false --title "dev Builds" --notes "$NOTES"
          fi
