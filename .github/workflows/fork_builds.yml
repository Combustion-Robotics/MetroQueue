name: Fork Builds

# Optimized (release) MetroQueue APKs, signed with the project key (DEV_KEYSTORE_BASE64).
# main -> "MetroQueue" (com.combustion.metroqueue): a normal release v<versionName> the first time a version is built.
#         Bump versionName in app/build.gradle.kts to publish the next release.
# dev  -> "MetroQueue Beta" (com.combustion.metroqueue.beta): a "dev Build" pre-release per commit.
# tv   -> "MetroQueue TV" (com.combustion.metroqueue.tv): APK artifact only, no release.
# any other branch (e.g. mix) -> "MetroQueue Mix" (com.combustion.metroqueue.mix): APK artifact only, no release.
on:
  push:
    branches: ["main", "dev", "mix", "tv"]
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'MetrolistGroup/Metrolist'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            echo "$DEV_KEYSTORE_BASE64" | base64 -d > app/ci-debug.keystore
          else
            echo "::warning::DEV_KEYSTORE_BASE64 secret not set. Using a throwaway key, so this APK won't install over earlier builds."
            keytool -genkeypair -keystore app/ci-debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Metrolist CI,O=Metrolist,C=US"
          fi

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew --console=plain :app:assembleFossRelease --warning-mode summary
        env:
          METROLIST_DEBUG_KEYSTORE_PATH: ci-debug.keystore
          METROLIST_APPLICATION_ID: ${{ github.ref_name == 'dev' && 'com.combustion.metroqueue.beta' || github.ref_name == 'tv' && 'com.combustion.metroqueue.tv' || github.ref_name != 'main' && 'com.combustion.metroqueue.mix' || '' }}
          METROLIST_APP_NAME: ${{ github.ref_name == 'dev' && 'MetroQueue Beta' || github.ref_name == 'tv' && 'MetroQueue TV' || github.ref_name != 'main' && 'MetroQueue Mix' || '' }}
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Name the build
        id: name
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG="v$VERSION"
            # The in-app updater looks for exactly this file name
            APK="MetroQueue.apk"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            TAG="dev-v$VERSION-${GITHUB_SHA::7}"
            APK="MetroQueue-Beta-v$VERSION-${GITHUB_SHA::7}.apk"
          elif [ "${{ github.ref_name }}" = "tv" ]; then
            TAG=""
            APK="MetroQueue-TV-v$VERSION-${GITHUB_SHA::7}.apk"
          else
            TAG=""
            APK="MetroQueue-Mix-v$VERSION-${GITHUB_SHA::7}.apk"
          fi
          mkdir -p out
          mv app/build/outputs/apk/foss/release/*.apk "out/$APK"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-${{ github.ref_name }}
          path: out/*.apk

      - name: Publish release
        if: github.ref_name == 'main' || github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          NOTES="Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          if [ "${{ github.ref_name }}" = "main" ]; then
            VERSION_CODE=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -1)
            CHANGELOG="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
            [ -f "$CHANGELOG" ] && NOTES="$(cat "$CHANGELOG")"$'\n\n'"$NOTES"
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "::notice::$TAG is already released. Bump versionName to publish a new release; this build is only kept as an artifact."
            else
              gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --latest --title "MetroQueue ${TAG#v}" --notes "$NOTES"
            fi
          else
            # Every dev build gets its own pre-release
            gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --prerelease --latest=false --title "dev Build ${TAG#dev-}" --notes "$NOTES"
          fi
