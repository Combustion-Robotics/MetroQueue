name: Fork Builds

# Optimized (release) APKs for this fork, signed with the same debug key as local builds.
# main -> "Metrolist Dev" (com.metrolist.music.dev), dev -> "Metrolist Beta" (com.metrolist.music.beta).
# Each run replaces the rolling "latest-<branch>" pre-release, so the newest APK is always at the same link.
on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'MetrolistGroup/Metrolist'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            echo "$DEV_KEYSTORE_BASE64" | base64 -d > app/ci-debug.keystore
          else
            echo "::warning::DEV_KEYSTORE_BASE64 secret not set. Using a throwaway key, so this APK won't install over earlier builds."
            keytool -genkeypair -keystore app/ci-debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Metrolist CI,O=Metrolist,C=US"
          fi

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew --console=plain :app:assembleFossRelease --warning-mode summary
        env:
          METROLIST_DEBUG_KEYSTORE_PATH: ci-debug.keystore
          METROLIST_APPLICATION_ID: ${{ github.ref_name == 'main' && 'com.metrolist.music.dev' || 'com.metrolist.music.beta' }}
          METROLIST_APP_NAME: ${{ github.ref_name == 'main' && 'Metrolist Dev' || 'Metrolist Beta' }}
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Rename APK
        run: |
          mkdir -p out
          mv app/build/outputs/apk/foss/release/*.apk "out/Metrolist-${{ github.ref_name }}-${GITHUB_SHA::7}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-${{ github.ref_name }}
          path: out/*.apk

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest-${{ github.ref_name }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest ${{ github.ref_name }} build" \
            --notes "Built from ${GITHUB_SHA::7} on ${{ github.ref_name }}: $(git log -1 --pretty=%s)"
