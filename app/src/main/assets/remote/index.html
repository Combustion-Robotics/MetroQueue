<style>
  /* Material 3 roles. Defaults are MetroQueue's default seed colour; /api/theme swaps in the scheme generated from the artwork. */
  :root {
    --primary: #904A4C; --on-primary: #FFFFFF;
    --primary-container: #FFDADA; --on-primary-container: #733336;
    --secondary-container: #FFDAD9; --on-secondary-container: #5D3F3F;
    --surface: #FFF8F7; --surface-container-low: #FFF0F0; --surface-container: #FCEAEA;
    --surface-container-high: #F6E4E4; --surface-container-highest: #F0DEDE;
    --on-surface: #22191A; --on-surface-variant: #524343;
    --outline: #857373; --outline-variant: #D7C1C1;
    --inverse-surface: #382E2E; --inverse-on-surface: #FFEDEC;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #FFB3B4; --on-primary: #561D21;
      --primary-container: #733336; --on-primary-container: #FFDADA;
      --secondary-container: #5D3F3F; --on-secondary-container: #FFDAD9;
      --surface: #1A1111; --surface-container-low: #22191A; --surface-container: #271D1D;
      --surface-container-high: #322828; --surface-container-highest: #3D3232;
      --on-surface: #F0DEDE; --on-surface-variant: #D7C1C1;
      --outline: #A08C8C; --outline-variant: #524343;
      --inverse-surface: #F0DEDE; --inverse-on-surface: #382E2E;
    }
  }
  :root {
    --state-hover: color-mix(in srgb, var(--on-surface) 8%, transparent);
    --state-press: color-mix(in srgb, var(--on-surface) 12%, transparent);
    --spring: cubic-bezier(0.34, 1.45, 0.64, 1);
    --color-fade: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--on-surface);
    font: 400 14px/20px Roboto, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.25px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    transition: var(--color-fade);
  }
  button { font: inherit; letter-spacing: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  svg { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }

  .app {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(320px, 440px) minmax(0, 1fr);
    gap: 32px;
    padding: 32px;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* Player: mirrors the app's new player screen */
  .player { display: flex; flex-direction: column; justify-content: center; gap: 20px; min-height: 0; }
  .art {
    width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
    border-radius: 6px;
    background: var(--surface-container-highest);
  }
  .info { display: flex; align-items: center; gap: 12px; }
  .meta { flex: 1; min-width: 0; }
  #title { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: 0; }
  #artist { margin: 2px 0 0; font-size: 16px; line-height: 24px; color: var(--on-surface-variant); letter-spacing: 0.15px; }
  #title, #artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Connected button group, like the share/like pair in the app */
  .group { display: flex; gap: 6px; flex: none; }
  .group button {
    width: 42px; height: 42px; display: grid; place-items: center;
    background: var(--surface-container-highest); color: var(--on-surface);
    border-radius: 3px; transition: var(--color-fade), border-radius 0.2s;
  }
  .group button:first-child { border-radius: 21px 3px 3px 21px; }
  .group button:last-child { border-radius: 3px 21px 21px 3px; }
  .group button.on { background: var(--primary); color: var(--on-primary); }
  .group button:active { border-radius: 10px; }

  /* Slider: 10dp rounded track without a thumb (PlayerSliderTrack) */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 10px; margin: 0; border-radius: 5px; cursor: pointer;
    background: linear-gradient(to right, var(--on-surface) var(--p, 0%), color-mix(in srgb, var(--on-surface) 20%, transparent) var(--p, 0%));
  }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 0; height: 10px; }
  input[type=range]::-moz-range-thumb { width: 0; height: 10px; border: 0; }
  .times { display: flex; justify-content: space-between; margin-top: 6px; color: var(--on-surface-variant); font-size: 12px; line-height: 16px; letter-spacing: 0.4px; font-variant-numeric: tabular-nums; }

  /* Previous / play / next pills that stretch when pressed */
  .controls { display: flex; gap: 8px; }
  .controls button {
    height: 68px; border-radius: 34px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: flex-grow 0.35s var(--spring), var(--color-fade), filter 0.15s;
  }
  .controls button svg { width: 32px; height: 32px; }
  .controls button:hover { filter: brightness(1.08); }
  #prev, #next { flex: 0.45 1 0; background: var(--surface-container-highest); color: var(--on-surface); }
  #play { flex: 1.3 1 0; background: var(--on-surface); color: var(--surface); font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px; }
  .controls:has(#play:active) #play { flex-grow: 1.9; }
  .controls:has(#play:active) #prev, .controls:has(#play:active) #next { flex-grow: 0.35; }
  .controls:has(#prev:active) #prev, .controls:has(#next:active) #next { flex-grow: 0.65; }
  .controls:has(#prev:active) #play, .controls:has(#next:active) #play { flex-grow: 1.1; }

  .volume { display: flex; align-items: center; gap: 12px; color: var(--on-surface-variant); }

  /* Side panel */
  .side {
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    background: var(--surface-container); border-radius: 28px;
    transition: var(--color-fade);
  }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px 20px; }
  .chip {
    height: 32px; padding: 0 16px; border-radius: 8px;
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--outline-variant); color: var(--on-surface-variant);
    font-weight: 500; letter-spacing: 0.1px;
    transition: var(--color-fade), padding 0.2s;
  }
  .chip svg { width: 18px; height: 18px; display: none; }
  .chip.on { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; padding-left: 8px; }
  .chip.on svg { display: block; }
  .chip:hover { background-image: linear-gradient(var(--state-hover), var(--state-hover)); }
  .spacer { flex: 1; }
  .tonal {
    height: 40px; padding: 0 16px 0 12px; border-radius: 20px; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
    background: var(--secondary-container); color: var(--on-secondary-container);
    font-weight: 500; letter-spacing: 0.1px; transition: var(--color-fade);
  }
  .tonal svg { width: 18px; height: 18px; }
  .tonal:hover { background-image: linear-gradient(var(--state-hover), var(--state-hover)); }

  .pane { flex: 1; overflow-y: auto; padding: 0 8px 12px; scrollbar-width: thin; scrollbar-color: var(--outline-variant) transparent; }
  .pane[hidden] { display: none; }
  .section { margin: 16px 12px 4px; color: var(--primary); font-weight: 500; letter-spacing: 0.1px; transition: var(--color-fade); }

  /* List item: MediaMetadataListItem */
  .row {
    position: relative;
    display: flex; align-items: center; gap: 16px;
    min-height: 64px; padding: 8px 12px; border-radius: 12px;
    cursor: pointer;
  }
  .row:hover { background: var(--state-hover); }
  .row:active { background: var(--state-press); }
  .row img, .row .ph { width: 48px; height: 48px; border-radius: 3px; object-fit: cover; background: var(--surface-container-highest); flex: none; }
  .row .txt { flex: 1; min-width: 0; }
  .row .t { font-size: 16px; line-height: 24px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .a { color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .d { color: var(--on-surface-variant); font-size: 12px; letter-spacing: 0.4px; font-variant-numeric: tabular-nums; }
  .row.current { background: var(--secondary-container); color: var(--on-secondary-container); }
  .row.current .a, .row.current .d { color: inherit; opacity: 0.8; }
  .row .acts {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    display: flex; padding-left: 24px;
    background: linear-gradient(to right, transparent, var(--surface-container) 24px);
    opacity: 0; pointer-events: none; transition: opacity 0.12s;
  }
  .row:hover .acts, .row:focus-within .acts { opacity: 1; pointer-events: auto; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center;
    color: var(--on-surface-variant);
  }
  .icon-btn:hover { background: var(--state-hover); color: var(--on-surface); }
  .icon-btn:active { background: var(--state-press); }

  .eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
  .eq i { width: 3px; background: currentColor; border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -0.3s; } .eq i:nth-child(3) { animation-delay: -0.6s; }
  .paused .eq i { animation-play-state: paused; }
  @keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }

  /* M3 search bar */
  .search-bar {
    display: flex; align-items: center; gap: 16px;
    margin: 4px 8px 8px; padding: 0 16px; height: 56px; border-radius: 28px;
    background: var(--surface-container-high); color: var(--on-surface-variant);
    transition: var(--color-fade);
  }
  .search-bar input { flex: 1; border: 0; outline: 0; background: none; color: var(--on-surface); font: inherit; font-size: 16px; letter-spacing: 0.5px; }
  .search-bar input::placeholder { color: var(--on-surface-variant); }
  .empty { text-align: center; color: var(--on-surface-variant); padding: 48px 16px; }

  /* M3 snackbar */
  #snackbar {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px);
    min-width: 288px; max-width: 560px; padding: 14px 16px; border-radius: 4px;
    background: var(--inverse-surface); color: var(--inverse-on-surface);
    box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2), 0 6px 10px rgba(0, 0, 0, 0.14);
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  }
  #snackbar.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; height: auto; padding: 16px; gap: 24px; }
    .art { max-width: 400px; margin: 0 auto; }
    .side { min-height: 70vh; }
    .row .acts { position: static; transform: none; padding: 0; background: none; opacity: 1; pointer-events: auto; }
    .row:has(.acts) .d { display: none; }
  }
</style>
</head>
<body class="paused">
<main class="app">
  <section class="player">
    <img id="art" class="art" alt="">
    <div class="info">
      <div class="meta">
        <h1 id="title">Nothing playing</h1>
        <p id="artist">Start something on your phone</p>
      </div>
      <div class="group">
        <button id="shuffle" title="Shuffle"><svg data-icon="shuffle"></svg></button>
        <button id="repeat" title="Repeat"><svg data-icon="repeat"></svg></button>
      </div>
    </div>
    <div>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button id="prev" title="Previous (Shift+←)"><svg data-icon="skip_previous"></svg></button>
      <button id="play" title="Play/Pause (Space)"><svg data-icon="play"></svg><span id="play-label">Play</span></button>
      <button id="next" title="Next (Shift+→)"><svg data-icon="skip_next"></svg></button>
    </div>
    <div class="volume">
      <svg data-icon="volume_up" id="volume-icon"></svg>
      <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
    </div>
  </section>

  <section class="side">
    <div class="side-head">
      <button class="chip on" data-tab="queue"><svg data-icon="check"></svg>Queue</button>
      <button class="chip" data-tab="search"><svg data-icon="check"></svg>Search</button>
      <div class="spacer"></div>
      <button class="tonal" id="clear" title="Keep only the current song"><svg data-icon="clear_all"></svg>Clear queue</button>
    </div>
    <div class="pane" id="queue-pane"></div>
    <div class="pane" id="search-pane" hidden>
      <form class="search-bar" id="search-form">
        <svg data-icon="search"></svg>
        <input id="search-input" type="search" placeholder="Search songs" autocomplete="off">
      </form>
      <div id="results"><div class="empty">Find a song to play or queue</div></div>
    </div>
  </section>
</main>
<div id="snackbar" role="status"></div>

  playlist_play: ["0 0 960 960", "M100,640L100,560L420,560L420,640L100,640ZM100,480L100,400L580,400L580,480L100,480ZM100,320L100,240L580,240L580,320L100,320ZM620,840L620,520L860,680L620,840Z"],
  playlist_add: ["0 0 960 960", "M120,640L120,560L400,560L400,640L120,640ZM120,480L120,400L560,400L560,480L120,480ZM120,320L120,240L560,240L560,320L120,320ZM640,800L640,640L480,640L480,560L640,560L640,400L720,400L720,560L880,560L880,640L720,640L720,800L640,800Z"],
  queue_music: ["0 0 960 960", "M640,800Q590,800 555,765Q520,730 520,680Q520,630 555,595Q590,560 640,560Q651,560 661,561.5Q671,563 680,568L680,240L880,240L880,320L760,320L760,680Q760,730 725,765Q690,800 640,800ZM120,640L120,560L440,560L440,640L120,640ZM120,480L120,400L600,400L600,480L120,480ZM120,320L120,240L600,240L600,320L120,320Z"],
  clear_all: ["0 0 960 960", "M120,680L120,600L680,600L680,680L120,680ZM200,520L200,440L760,440L760,520L200,520ZM280,360L280,280L840,280L840,360L280,360Z"],
  music_note: ["0 0 960 960", "M400,840Q334,840 287,793Q240,746 240,680Q240,614 287,567Q334,520 400,520Q423,520 442.5,525.5Q462,531 480,542L480,120L720,120L720,280L560,280L560,680Q560,746 513,793Q466,840 400,840Z"],
  check: ["0 0 24 24", "M9,16.17L4.83,12l-1.42,1.41L9,19 21,7l-1.41,-1.41z"],

  expand_more: ["0 0 960 960", "M480,615L240,375L296,319L480,503L664,319L720,375L480,615Z"],
};
const dark = matchMedia("(prefers-color-scheme: dark)");

let state = null, queue = [], theme = null, themeFor, lastHash = null, syncedAt = 0, dragging = false, failures = 0;

function setIcon(svg, name) {
  const [viewBox, d] = ICONS[name];
  svg.setAttribute("viewBox", viewBox);
  svg.innerHTML = `<path d="${d}"/>`;
}
function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  setIcon(svg, name);
  return svg;
}
document.querySelectorAll("svg[data-icon]").forEach((svg) => setIcon(svg, svg.dataset.icon));

async function api(path, params = {}, method = "GET") {
  const q = new URLSearchParams({ key: KEY, ...params });
  const res = await fetch(`${path}?${q}`, { method, cache: "no-store" });
  if (res.status === 403) throw new Error("bad-key");
  if (!res.ok) throw new Error(res.status);
  return res.status === 204 ? null : res.json();
}

async function cmd(action, params = {}) {
  try {
    await api("/api/cmd", { action, ...params }, "POST");
    poll();
    return true;
  } catch {
    snackbar("Couldn't do that right now");
    return false;
  }
}

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids.filter((k) => k != null));
  return e;
}
function iconBtn(name, title, onClick) {
  return el("button", { className: "icon-btn", title, onclick: (e) => { e.stopPropagation(); onClick(); } }, icon(name));
}
function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}
function setFill(range) {
  range.style.setProperty("--p", `${(range.value / range.max) * 100}%`);
}
let snackTimer;
function snackbar(msg) {
  const s = $("snackbar");
  s.textContent = msg;
  s.classList.add("show");
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => s.classList.remove("show"), 2500);
}

function applyTheme() {
  if (!theme) return;
  for (const [role, hex] of Object.entries(theme[dark.matches ? "dark" : "light"])) {
    document.documentElement.style.setProperty(`--${role}`, hex);
  }
}
dark.addEventListener("change", applyTheme);
async function loadTheme(trackId) {
  themeFor = trackId;
  try {
    const t = await api("/api/theme");
    if (themeFor === trackId) { theme = t; applyTheme(); }
  } catch {}
}

function trackRow(track, { current = false, onClick, actions = [] }) {
  return el("div", { className: "row" + (current ? " current" : ""), onclick: onClick },
    track.art ? el("img", { src: track.art, loading: "lazy", alt: "" }) : el("div", { className: "ph" }),
    el("div", { className: "txt" },
      el("div", { className: "t", textContent: track.title }),
      el("div", { className: "a", textContent: track.artist })),
    current ? el("div", { className: "eq" }, el("i"), el("i"), el("i")) : null,
    track.duration > 0 ? el("div", { className: "d", textContent: fmt(track.duration) }) : null,
    actions.length ? el("div", { className: "acts" }, ...actions) : null);
}

function renderQueue() {
  const pane = $("queue-pane");
  const index = state?.index ?? -1;
  pane.replaceChildren();
  if (index < 0 || !queue.length) {
    pane.append(el("div", { className: "empty", textContent: "The queue is empty" }));
    return;
  }
  pane.append(el("div", { className: "section", textContent: "Now playing" }));
  pane.append(trackRow(queue[index], { current: true }));

  let picks = 0;
  while (queue[index + 1 + picks]?.pick) picks++;
  for (let i = index + 1; i < queue.length; i++) {
    if (i === index + 1 && picks) pane.append(el("div", { className: "section", textContent: "Next in queue" }));
    if (i === index + 1 + picks) {
      pane.append(el("div", { className: "section", textContent: state.queueTitle ? `Next from: ${state.queueTitle}` : "Next up" }));
    }
    pane.append(trackRow(queue[i], {
      onClick: () => cmd("jump", { a: i }),
      actions: [
        i > index + 1 ? iconBtn("expand_less", "Move up", () => cmd("move", { a: i, b: i - 1 })) : null,
        i < queue.length - 1 ? iconBtn("expand_more", "Move down", () => cmd("move", { a: i, b: i + 1 })) : null,
        iconBtn("close", "Remove", () => cmd("remove", { a: i })),
      ].filter(Boolean),
    }));
  }
}

function render() {
  const t = state.track;
  document.body.classList.toggle("paused", !state.playing);
  $("title").textContent = t?.title ?? "Nothing playing";
  $("artist").textContent = t?.artist ?? "Start something on your phone";
  document.title = t ? `${t.title} · MetroQueue` : "MetroQueue Remote";
  if (t?.art && $("art").getAttribute("src") !== t.art) $("art").src = t.art;
  if (t && t.id !== themeFor) loadTheme(t.id);
  setIcon($("play").querySelector("svg"), state.playing ? "pause" : "play");
  $("play-label").textContent = state.playing ? "Pause" : "Play";
  $("shuffle").classList.toggle("on", state.shuffle);
  $("repeat").classList.toggle("on", state.repeat !== 0);
  setIcon($("repeat").querySelector("svg"), state.repeat === 1 ? "repeat_one" : "repeat");
  if (document.activeElement !== $("volume")) {
    $("volume").value = Math.round(state.volume * 100);
    setFill($("volume"));
  }
  setIcon($("volume-icon"), Number($("volume").value) === 0 ? "volume_off" : "volume_up");
  $("dur").textContent = fmt(state.duration);
  tick();
}

function tick() {
  if (!state || dragging) return;
  const elapsed = state.playing ? Date.now() - syncedAt : 0;
  const pos = Math.min(state.position + elapsed, state.duration || Infinity);
  $("seek").value = state.duration ? (pos / state.duration) * 1000 : 0;
  setFill($("seek"));
  $("pos").textContent = fmt(pos);
}

let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const prevIndex = state?.index;
    state = await api("/api/state");
    syncedAt = Date.now();
    failures = 0;
    if (state.queueHash !== lastHash) {
      queue = await api("/api/queue");
      lastHash = state.queueHash;
      renderQueue();
    } else if (state.index !== prevIndex) {
      renderQueue();
    }
    render();
  } catch (e) {
    if (e.message === "bad-key") {
      snackbar("This link is invalid. Copy it again from MetroQueue settings");
    } else if (++failures === 3) {
      snackbar("Can't reach your phone. Is MetroQueue open on the same Wi-Fi?");
    }
  } finally {
    polling = false;
  }
}

// Controls
$("play").onclick = () => {
  if (state) { state.playing = !state.playing; render(); }
  cmd("toggle");
};
$("next").onclick = () => cmd("next");
$("prev").onclick = () => cmd("prev");
$("shuffle").onclick = () => cmd("shuffle");
$("repeat").onclick = () => cmd("repeat");
$("clear").onclick = () => cmd("clear").then((ok) => ok && snackbar("Queue cleared"));

const seek = $("seek");
seek.oninput = () => {
  dragging = true;
  setFill(seek);
  if (state) $("pos").textContent = fmt((seek.value / 1000) * state.duration);
};
seek.onchange = () => {
  dragging = false;
  if (!state) return;
  const ms = Math.round((seek.value / 1000) * state.duration);
  state.position = ms;
  syncedAt = Date.now();
  cmd("seek", { a: ms });
};

let volumeTimer;
$("volume").oninput = (e) => {
  setFill(e.target);
  setIcon($("volume-icon"), Number(e.target.value) === 0 ? "volume_off" : "volume_up");
  clearTimeout(volumeTimer);
  volumeTimer = setTimeout(() => cmd("volume", { a: e.target.value }), 120);
};

// Tabs (filter chips)
document.querySelectorAll(".chip").forEach((chip) => {
  chip.onclick = () => {
    document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === chip));
    $("queue-pane").hidden = chip.dataset.tab !== "queue";
    $("search-pane").hidden = chip.dataset.tab !== "search";
    if (chip.dataset.tab === "search") $("search-input").focus();
  };
});

// Search
$("search-form").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("search-input").value.trim();
  if (!q) return;
  const results = $("results");
  results.replaceChildren(el("div", { className: "empty", textContent: "Searching…" }));
  try {
    const songs = await api("/api/search", { q });
    results.replaceChildren();
    if (!songs.length) results.append(el("div", { className: "empty", textContent: "No songs found" }));
    songs.forEach((song) => results.append(trackRow(song, {
      onClick: () => cmd("play", { id: song.id }).then((ok) => ok && snackbar(`Playing ${song.title}`)),
      actions: [
        iconBtn("playlist_play", "Play next", () => cmd("playNext", { id: song.id }).then((ok) => ok && snackbar("Playing next"))),
        iconBtn("playlist_add", "Add to queue", () => cmd("add", { id: song.id }).then((ok) => ok && snackbar("Added to queue"))),
      ],
    })));
  } catch {
    results.replaceChildren(el("div", { className: "empty", textContent: "Search failed. Try again" }));
  }
};

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  else if (e.shiftKey && e.key === "ArrowRight") cmd("next");
  else if (e.shiftKey && e.key === "ArrowLeft") cmd("prev");
});

// Poll only while the page is visible so the phone stays idle otherwise
setInterval(() => { if (!document.hidden) poll(); }, 1000);
setInterval(tick, 250);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
poll();
</script>
</body>
